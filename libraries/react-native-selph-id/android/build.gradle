dependencies {
    implementation 'com.facebook.react:react-native:+'
    //implementation files('src/main/libs/fphi-selphid-core-android.aar')
    //implementation files('src/main/libs/fphi-selphid-drawer-android.aar')
    //implementation files('src/main/libs/fphi-selphid-extractor.aar')
    implementation 'com.facephi.selphid.android:widget-ml:1.19.2' //ML
    //implementation 'com.facephi.selphid.android:widget:1.19.2' // NOML
    //implementation 'com.google.mlkit:text-recognition:16.0.0-beta6'
    //implementation 'com.google.mlkit:text-recognition-japanese:16.0.0-beta6' //ADD THIS, ONLY IF YOU WORK WITH THIS SPECIFIC LANGUAGE
